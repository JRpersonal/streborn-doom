name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        run: VERSION="${GITHUB_REF_NAME}" sh build.sh
      - name: Checksums
        run: cd dist && sha256sum doom-str doompad str-doom-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: str-doom
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/str-doom-* dist/doom-str dist/doompad dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
